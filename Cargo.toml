[workspace]
resolver = "3"
# Cargo rejects a member path that does not exist. Add "apps/reso-app/src-tauri" at step 5.
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lowpolycat1/reso"
publish = false

[workspace.dependencies]
# Add shared dependencies here when a crate needs them.

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"
